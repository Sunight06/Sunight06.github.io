<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小白录制 · 电脑远程录制</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f7f7f7; }
    @media (prefers-color-scheme: dark) { html, body { background: #000; } }
    /* 实时画面：引擎按 Compose 量出的预览卡片位置摆放（placeVideo）。 */
    #screen { position: fixed; z-index: 10; border-radius: 24px; overflow: hidden; clip-path: inset(0 round 24px); visibility: hidden; background: #000; object-fit: contain; outline: none;
      touch-action: none; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 15px system-ui, "Microsoft YaHei", sans-serif; color: #888; }
  </style>
  <script type="module" src="js/engine.js"></script>
  <script src="app/remoteui.js"></script>
</head>
<body>
  <div id="boot">正在加载…</div>
</body>
</html>
